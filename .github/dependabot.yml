# Dependabot: security fixes + routine dependency updates (same policy as capsuleers.intel).
#
# Security updates are turned on in the repo settings (Dependabot alerts +
# security updates); this file shapes the PRs they open. All vulnerable
# dependencies are grouped into ONE security PR per ecosystem.
#
# There is deliberately NO `allow` list: dependabot-core applies `allow` to
# security updates too, so an allow-list would silently suppress security
# fixes for every other package.
#
# Version updates: minor + patch grouped into one PR; majors open as separate
# PRs (close one to make Dependabot ignore that major). Nothing is auto-merged:
# unlike capsuleers.intel there is no eve-fit-engine to keep "always latest".

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # vue-tsc breaks on TypeScript 7: keep TS on 5.x until vue-tsc supports it.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
